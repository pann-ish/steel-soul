<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>月光烘焙坊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: sweet, lively bakery sim
   IDEA: a wide-angle cutaway of one whole dessert shop — kitchen, glass case, dining room, door
   PICTURE: the shop itself, with manager-pastry-chef 骆捷赢 walking between ovens and tables
   COLOUR and TYPE: strawberry pink + lemon yellow, hot pink accent; ZCOOL KuaiLe + Noto Sans SC
   LAYOUT: HUD, scene, hint, chef card, bottom bar; phone-first */
:root{color-scheme:light;--bg:#fff4c7;--ink:#5a2340;--soft:#9a5a78;--pink:#ff5c9a;--pink2:#ffb3cf;--yel:#ffd23f;--mint:#3fcf9a}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:light}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans SC",system-ui,sans-serif;overflow-x:clip;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hud{display:flex;gap:6px;align-items:center;padding:10px 12px;background:var(--pink);position:sticky;top:0;z-index:5}
.hud .t{background:none;border:0;padding:0;cursor:pointer;font-family:"ZCOOL KuaiLe",cursive;font-size:22px;color:#fff;flex:none;margin-right:auto;text-shadow:0 2px 0 #c2306c}
.chip{display:flex;align-items:center;gap:4px;background:#fff;border-radius:99px;padding:3px 10px;font-weight:900;font-size:14px;white-space:nowrap}
.lv{position:relative;width:86px}
.lv .bar{position:absolute;left:8px;right:8px;bottom:2px;height:4px;border-radius:3px;background:#ffd6e6;overflow:hidden}
.lv .bar i{display:block;height:100%;background:var(--yel);width:0}
#sc{display:block;width:100%;height:auto;font-family:"Noto Sans SC",sans-serif;background:#fffaf0}
#sc [data-act]{cursor:pointer}
#sc text{pointer-events:none}
.glow{animation:pulse .9s infinite}
@keyframes pulse{50%{opacity:.25}}
.fl{animation:fl 1.1s forwards;font-weight:900;paint-order:stroke;stroke:#c2306c;stroke-width:5px}
@keyframes fl{to{transform:translateY(-60px);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.panel{padding:12px;flex:1}
.hint{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--yel);border-radius:16px;padding:10px 12px;font-weight:700;font-size:15px;box-shadow:0 4px 0 #f0c020}
.hint .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--yel);display:grid;place-items:center;font-weight:900}
.chef{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:8px 12px;margin-top:10px;box-shadow:0 4px 0 var(--pink2)}
.chef svg{width:58px;height:70px;flex:none}
.chef .i{flex:1}
.chef b{font-family:"ZCOOL KuaiLe",cursive;font-weight:400;font-size:20px;color:var(--pink)}
.chef small{color:var(--soft);margin-left:6px}
.chef p{margin:0;font-size:14px;font-weight:700}
.chef .q{flex:none;font-size:13px;color:var(--soft);text-align:right}
.note{font-size:13px;color:var(--soft);text-align:center;margin:12px 0 0}
.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--pink);position:sticky;bottom:0;z-index:5}
.nav button,.btn{min-height:44px;border:0;border-radius:14px;font:900 15px "Noto Sans SC",sans-serif;cursor:pointer;background:#fff;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn.p{background:var(--yel);box-shadow:0 3px 0 #e0a800}
.btn.s{background:#fff4c7;min-height:38px;font-size:13px;padding:0 10px}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.nav button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.modal{position:fixed;inset:0;background:#5a234066;display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.sheet{width:100%;max-width:560px;max-height:84vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:16px 14px 24px;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-family:"ZCOOL KuaiLe",cursive;font-weight:400;font-size:24px;margin:0 0 4px;color:var(--pink)}
.sheet p.sub{margin:0 0 12px;color:var(--soft);font-size:14px}
.row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:#fff4c7;margin-bottom:8px;border:2px solid transparent;flex-wrap:wrap}
.row.want{border-color:var(--pink);background:#ffe3ee}
.row>svg,.row>.ph{width:64px;height:64px;flex:none;border-radius:12px}
.ph{object-fit:cover;display:block}
.row .info{flex:1;min-width:120px}
.row .info b{display:block}
.row .info span{font-size:13px;color:var(--soft)}
.row .info em{font-style:normal;font-size:12px;font-weight:900;color:#fff;background:var(--pink);border-radius:99px;padding:1px 8px;margin-left:4px}
.row .acts{display:flex;gap:6px;flex:none}
.row .btn{padding:0 14px}
.row.lockd{opacity:.5}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.names button{min-height:48px;border:2px solid #ffd6e6;border-radius:14px;background:#fff;font:400 18px "ZCOOL KuaiLe",cursive;color:var(--ink);cursor:pointer}
.names button.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.cname{display:flex;gap:8px;margin-bottom:12px}
.cname input{flex:1;min-height:44px;border:2px solid var(--pink2);border-radius:14px;padding:0 12px;font:16px "Noto Sans SC",sans-serif;color:var(--ink)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;background:#fff4c7}
.tabs button.on{background:var(--pink);color:#fff}
.toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;padding:8px 16px;border-radius:99px;z-index:30;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;top:72px}
@media(max-width:380px){.hud .t{font-size:18px}.chip{padding:3px 7px;font-size:13px}.lv{width:74px}}
@media(prefers-reduced-motion:reduce){.glow,.fl,.shake,.sheet{animation:none!important}}
</style>
<script data-goatcounter="https://steelsoul.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="description" content="月光烘焙坊：店长兼甜点师骆捷赢的甜点店经营小游戏，手机打开就能玩。">
</head>
<body>
<div class="app">
  <div class="hud">
    <button class="t" id="shopName" aria-label="改店名">月光烘焙坊</button>
    <div class="chip" id="coins">🪙 0</div>
    <div class="chip lv" id="lv">Lv 1<span class="bar"><i id="xpb"></i></span></div>
    <div class="chip" id="rate">★ 5.0</div>
  </div>
  <svg id="sc" viewBox="0 0 800 900" aria-label="甜点店广角画面">
    <defs id="defs"></defs>
    <g id="bg"></g>
    <g id="decor"></g>
    <g id="ovens"></g>
    <g id="chefK"></g>
    <g id="case"></g>
    <g id="chairs"></g>
    <g id="custs"></g>
    <g id="tables"></g>
    <g id="chefF"></g>
    <g id="bubs"></g>
    <g id="fx"></g>
  </svg>
  <div class="panel">
    <div class="hint" id="hint"></div>
    <div class="chef">
      <svg viewBox="-42 -160 84 104" id="port"></svg>
      <div class="i"><b>骆捷赢</b><small>店长 · 甜点师</small><p id="chefSt">空闲中</p></div>
      <div class="q" id="tq"></div>
    </div>
    <p class="note">点烤箱 → 烤点心；点客人 → 店长送餐/打包；点脏桌子 → 收拾。食谱里可以换成你拍的甜点照片。</p>
  </div>
  <div class="nav">
    <button id="bRecipes">食谱 · 照片</button>
    <button id="bShop">装修商店</button>
    <button id="bStats">店铺档案</button>
  </div>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

 $('coins').textContent='🪙 '+S.coins;
 $('shopName').textContent=S.shop;document.title=S.shop;
 $('lv').firstChild.textContent='Lv '+S.lv;
 $('xpb').style.width=Math.min(100,S.xp/need(S.lv)*100)+'%';
 $('rate').textContent='★ '+S.rating.toFixed(1);
 const th=TH.find(t=>t.id===S.theme)||TH[0];
 $('sc').style.setProperty('--kf',th.c[0]);$('sc').style.setProperty('--df',th.c[1]);
 $('decor').innerHTML=S.decor.map(d=>DSVG[d]||'').join('');
}
function renderChefSt(){
 $('chefSt').textContent=cur?cur.label+'…':'空闲中，等你下指令';
 $('tq').innerHTML=tasks.length?`还有 ${tasks.length}<br>件事排队`:'';
}
function renderHint(){
 const now=Date.now();
 const done=S.ovens.some(o=>o&&!o.col&&now-o.s>=rec(o.r).sec*1000);
 const sell=custs.some(c=>c.state==='wait'&&S.stock[c.want]>0);
 const dirty=TB.some(t=>t.dirty&&!t.clearing);
 const wants=[...new Set(custs.filter(c=>c.state==='wait'&&!(S.stock[c.want]>0)).map(c=>rec(c.want).n))];
 const idle=S.ovens.some(o=>!o),baking=S.ovens.find(o=>o&&now-o.s<rec(o.r).sec*1000);
 let n,t;
 if(done){n=3;t='烤好啦！点发光的烤箱，骆店长会把点心收进甜点柜'}
 else if(sell){n=4;t='泡泡变绿的客人 → 点他，店长会端去餐桌（堂食）或打包（外带）'}
 else if(dirty){n=5;t='客人吃完走了，点有盘子的桌子让店长收拾，下一位才能坐'}
 else if(idle){n=1;t=wants.length?`客人在等「${wants.join('、')}」→ 点空烤箱选它来烤`:'点后厨的空烤箱，先烤「黄油曲奇」（最快最便宜）'}
 else if(baking){n=2;t=`烤箱正在烤，等一下（还要约 ${Math.ceil(rec(baking.r).sec-(now-baking.s)/1000)} 秒）`}
 else{n=2;t='烤箱都在忙，等烤好再收'}
 const h=`<span class="n">${n}</span><span>${t}</span>`;
 if($('hint').innerHTML!==h)$('hint').innerHTML=h;
}
const all=()=>{oKey='';renderHud();renderCase();renderOvens();renderTables();refreshBubbles();renderHint();renderChefSt()};
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}
function float(x,y,txt,col='#fff'){const t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','26');t.setAttribute('fill',col);t.setAttribute('class','fl');t.textContent=txt;$('fx').appendChild(t);setTimeout(()=>t.remove(),1100)}
function gainXp(n){S.xp+=n;while(S.xp>=need(S.lv)){S.xp-=need(S.lv);S.lv++;gc('升到Lv'+S.lv);const nu=R.filter(r=>r.lv===S.lv);toast(`升到 Lv ${S.lv}！`+(nu.length?`解锁「${nu.map(r=>r.n).join('、')}」`:''))}}

/* ---------- movement ---------- */
const zone=p=>p[1]<430?0:1;
function route(a,b){return zone(a)===zone(b)?[b]:zone(a)===0?[[720,290],[720,470],b]:[[720,470],[720,290],b]}
function buildPts(to){let pts=[],from=[chef.x,chef.y];for(const p of to){pts.push(...route(from,p));from=p}return pts}
function move(e,dt,sp){
 if(!e.path.length)return false;
 const [tx,ty]=e.path[0],dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy),st=sp*dt;
 if(Math.abs(dx)>2)e.face=dx<0?-1:1;
 if(d<=st){e.x=tx;e.y=ty;e.path.shift()}else{e.x+=dx/d*st;e.y+=dy/d*st}
 return true;
}
function setCarry(id){chef.carry=id;chefEl.querySelector('.carry').innerHTML=id?`<ellipse cx="30" cy="-52" rx="24" ry="5" fill="#bfb6c6"/>${art(id,8,-96,46)}`:''}
function addTask(t){tasks.push(t);renderChefSt()}

/* ---------- customers ---------- */
function spawn(){
 const ft=TB.map((t,i)=>i).filter(i=>!TB[i].occ&&!TB[i].dirty);
 const fq=[0,1,2].filter(i=>!custs.some(c=>c.type==='take'&&c.slot===i));
 if(!ft.length&&!fq.length)return;
 const type=!fq.length?'dine':!ft.length?'take':(Math.random()<.55?'dine':'take');
 const u=unlocked(),inS=u.filter(r=>S.stock[r.id]>0);
 const r=S.served<2?R[0]:rnd((inS.length&&Math.random()<.7)?inS:u);
 const c={id:++cid,type,want:r.id,x:DOOR[0],y:DOOR[1],path:[],state:'in',ml:2,
  look:{skin:rnd(SKIN),hair:rnd(HAIR),shirt:rnd(SHIRT),hs:Math.floor(Math.random()*3)}};
 if(type==='dine'){c.seat=rnd(ft);const t=TB[c.seat];t.occ=c.id;c.path=[[600,t.y-4],[t.x,t.y-4]]}
 else{c.slot=rnd(fq);c.path=[[600,580],QS[c.slot]]}
 c.pat=(type==='dine'?95000:75000)+(S.served<5?30000:0)+Math.random()*20000;
 c.el=document.createElementNS(NS,'g');c.el.dataset.act='cust:'+c.id;$('custs').appendChild(c.el);c.bu=document.createElementNS(NS,'g');c.bu.dataset.act='cust:'+c.id;$('bubs').appendChild(c.bu);
 custs.push(c);drawCust(c);
}
function leave(c,angry){
 c.state='leave';
 if(c.type==='dine'){const t=TB[c.seat];if(t.occ===c.id)t.occ=null}
 c.path=c.type==='dine'?[[600,c.y],[600,880],DOOR]:[[600,580],DOOR];
 if(angry){c.ml=0;S.missed++;S.rating=Math.max(1,S.rating-.15);float(c.x,c.y-100,'等太久走了…','#5a2340');save();renderHud()}
 drawCust(c);
}
function pay(c,mult){
 const r=rec(c.want),tip=Math.round(r.price*(tipPct()/100+(c.fs>.6?.2:0)));
 const amt=Math.round(r.price*mult)+tip;
 S.coins+=amt;S.earned+=amt;S.served++;if([10,50,100,300,1000].includes(S.served))gc('服务'+S.served+'位客人');S.rating=Math.min(5,S.rating+.05);gainXp(r.xp);
 float(c.x,c.y-95,`+${amt} 🪙`);save();renderHud();
}
function serve(c){
 if(c.state!=='wait')return;
 const r=rec(c.want);
 if(!(S.stock[c.want]>0)){const g=c.bu.firstChild||c.el.firstChild;g.classList.remove('shake');void g.getBBox();g.classList.add('shake');toast(`甜点柜没有${r.n}，先去烤！`);return}
 S.stock[c.want]--;c.state='pending';c.fs=1-(Date.now()-c.t0)/c.pat;
 drawCust(c);renderCase();refreshBubbles();save();
 if(c.type==='take'){
  addTask({to:[[QS[c.slot][0],290]],wait:450,label:`打包${r.n}给外带客人`,start:()=>setCarry(c.want),
   done:()=>{setCarry(null);c.bag=true;pay(c,1);leave(c)}});
 }else{
  const t=TB[c.seat];
  addTask({to:[[300,290],[t.x+95,t.y+28]],wait:450,label:`把${r.n}端去 ${c.seat+1} 号桌`,start:()=>setCarry(c.want),
   done:()=>{setCarry(null);c.state='eat';c.eatEnd=Date.now()+5500;t.food=c.want;renderTables();drawCust(c)}});
 }
}

/* ---------- input ---------- */
function nearCust(e){
 const sc=$('sc'),r=sc.getBoundingClientRect(),k=800/r.width,x=(e.clientX-r.left)*k,y=(e.clientY-r.top)*k;
 let best=null,bd=60;
 for(const c of custs){if(c.state!=='wait')continue;for(const [px,py] of [[c.x,c.y-127],[c.x,c.y-45]]){const d=Math.hypot(px-x,py-y);if(d<bd){bd=d;best=c}}}
 return best;
}
$('sc').addEventListener('click',e=>{
 let a=e.target.closest('[data-act]');
 const nc=nearCust(e);
 if(nc&&(!a||!a.dataset.act.startsWith('cust')||custs.find(c=>'cust:'+c.id===a.dataset.act)?.state!=='wait')){serve(nc);return}
 if(!a)return;
 const [k,v]=a.dataset.act.split(':');
 if(k==='cust'){const c=custs.find(c=>c.id==v);if(c)serve(c)}
 else if(k==='table'){const t=TB[+v];if(!t.dirty||t.clearing)return;t.clearing=true;renderTables();
  addTask({to:[[t.x+95,t.y+28]],wait:600,label:`收拾 ${+v+1} 号桌`,done:()=>{t.dirty=false;t.clearing=false;gainXp(1);float(t.x,t.y-40,'干净啦 ✨');renderTables();save();renderHud()}})}
 else if(k==='buy'){const i=+v,c=OVEN_COST[i];if(S.coins<c){toast(`扩建还差 ${c-S.coins} 金币`);return}S.coins-=c;S.ovens.push(null);save();all();toast('新烤箱装好啦')}
 else if(k==='oven'){
  const i=+v,o=S.ovens[i];
  if(!o){pick(i);return}
  if(o.col)return;
  const r=rec(o.r),el=Date.now()-o.s-r.sec*1000;
  if(el<0){toast(`${r.n}还要 ${Math.ceil(-el/1000)} 秒`);return}
  o.col=true;const fresh=el<5000;oKey='';renderOvens();
  addTask({to:[[OVX(i)+67,268]],wait:400,label:`把${r.n}收进甜点柜`,done:()=>{
   const q=r.qty+(fresh?1:0);S.stock[r.id]=(S.stock[r.id]||0)+q;S.ovens[i]=null;S.baked+=q;gainXp(1);
   float(OVX(i)+67,150,`${r.n} ×${q}`);save();all()}});
 }
});
function open(h){$('sheet').innerHTML=h;$('modal').classList.add('show')}
function close(){$('modal').classList.remove('show')}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('[data-close]'))close()});
function pick(i){
 const want=new Set(custs.filter(c=>c.state==='wait').map(c=>c.want));
 const list=[...R].sort((a,b)=>(want.has(b.id)&&b.lv<=S.lv)-(want.has(a.id)&&a.lv<=S.lv));
 open(`<h3>烤点什么？</h3><p class="sub">粉框是客人正在等的。材料费先付，烤好收进甜点柜再卖。</p>`+list.map(r=>{const lk=r.lv>S.lv,w=want.has(r.id)&&!lk;
  return `<div class="row ${lk?'lockd':''} ${w?'want':''}">${artH(r.id)}<div class="info"><b>${r.n}${w?'<em>客人在等</em>':''}</b><span>${lk?`Lv ${r.lv} 解锁`:`${r.sec}秒 · 出 ${r.qty} 份 · 每份卖 ${r.price}`}</span></div>${lk?'':`<button class="btn p" data-bake="${r.id}" data-i="${i}" ${S.coins<r.cost?'disabled':''}>🪙 ${r.cost}</button>`}</div>`}).join('')+`<button class="btn" style="width:100%;background:#fff4c7" data-close>取消</button>`);
}
function book(){
 open(`<h3>食谱 · 照片</h3><p class="sub">已解锁 ${unlocked().length} / ${R.length}。点「换照片」可以用你自己拍的甜点照片，游戏里会全部换成照片显示。</p>`+R.map(r=>{const lk=r.lv>S.lv;
  return `<div class="row ${lk?'lockd':''}">${artH(r.id)}<div class="info"><b>${r.n}</b><span>Lv ${r.lv} · ${r.sec}秒 · 成本 ${r.cost} · ${r.qty}份×${r.price}</span></div><div class="acts"><label class="btn s">📷 换照片<input type="file" accept="image/*" data-ph="${r.id}" hidden></label>${PH[r.id]?`<button class="btn s" data-unph="${r.id}">用插画</button>`:''}</div></div>`}).join('')+`<button class="btn" style="width:100%;background:#fff4c7" data-close>关闭</button>`);
}
function loadPhoto(file,id){
 const fr=new FileReader();
 fr.onload=()=>{const im=new Image();im.onload=()=>{const n=260,cv=document.createElement('canvas');cv.width=cv.height=n;const k=Math.max(n/im.width,n/im.height),w=im.width*k,h=im.height*k;cv.getContext('2d').drawImage(im,(n-w)/2,(n-h)/2,w,h);
  PH[id]=cv.toDataURL('image/jpeg',.82);gc('上传甜点照片');PH.v=(PH.v||0)+1;if(!savePH())toast('存储空间不够，这张照片只在本次有效');else toast(`${rec(id).n}换成照片啦`);
  renderCase();renderTables();renderHud();custs.forEach(drawCust);oKey='';renderOvens();book()};im.onerror=()=>toast('这张图读不出来，换一张试试');im.src=fr.result};
 fr.readAsDataURL(file);
}
$('sheet').addEventListener('change',e=>{const f=e.target.closest('input[data-ph]');if(f&&f.files[0])loadPhoto(f.files[0],f.dataset.ph)});
$('sheet').addEventListener('click',e=>{
 const u=e.target.closest('[data-unph]');
 if(u){delete PH[u.dataset.unph];PH.v=(PH.v||0)+1;savePH();renderCase();renderTables();renderHud();custs.forEach(drawCust);oKey='';renderOvens();book();return}
 const b=e.target.closest('[data-bake]');
 if(b){const r=rec(b.dataset.bake),i=+b.dataset.i;if(S.coins<r.cost||S.ovens[i])return;S.coins-=r.cost;S.ovens[i]={r:r.id,s:Date.now()};save();close();all();
  addTask({to:[[OVX(i)+67,268]],wait:350,label:`把${r.n}放进烤箱`});return}
 const d=e.target.closest('[data-dec]');
 if(d){const it=D.find(x=>x.id===d.dataset.dec);if(S.coins<it.cost)return;S.coins-=it.cost;S.decor.push(it.id);save();all();shop('d');toast(`摆上了${it.n}，小费 +${it.tip}%`);return}
 const t=e.target.closest('[data-th]');
 if(t){const it=TH.find(x=>x.id===t.dataset.th);if(!t.dataset.own){if(S.coins<it.cost)return;S.coins-=it.cost;S.ownTh=[...(S.ownTh||[]),it.id]}S.theme=it.id;save();all();shop('t');return}
 const tab=e.target.closest('[data-tab]');if(tab)shop(tab.dataset.tab);
});
function shop(tab='d'){
 const own=['night',...(S.ownTh||[])];
 const body=tab==='d'?D.map(d=>{const has=S.decor.includes(d.id);return `<div class="row"><svg viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="#fff"/><path d="M20 8l3.4 7.4 8 .8-6 5.4 1.8 8-7.2-4.2-7.2 4.2 1.8-8-6-5.4 8-.8z" fill="${has?'#3fcf9a':'#ffd23f'}"/></svg><div class="info"><b>${d.n}</b><span>客人小费 +${d.tip}%</span></div>${has?'<button class="btn" disabled>已摆放</button>':`<button class="btn p" data-dec="${d.id}" ${S.coins<d.cost?'disabled':''}>🪙 ${d.cost}</button>`}</div>`}).join('')
 :TH.map(t=>{const o=own.includes(t.id),cu=S.theme===t.id;return `<div class="row"><svg viewBox="0 0 40 40"><rect width="40" height="20" rx="8" fill="${t.c[0]}"/><rect y="18" width="40" height="22" rx="8" fill="${t.c[1]}"/></svg><div class="info"><b>${t.n}</b><span>${cu?'正在使用':o?'已拥有':'后厨地砖 + 堂食地板'}</span></div>${cu?'<button class="btn" disabled>使用中</button>':`<button class="btn ${o?'':'p'}" data-th="${t.id}" ${o?'data-own="1"':''} ${!o&&S.coins<t.cost?'disabled':''}>${o?'换上':'🪙 '+t.cost}</button>`}</div>`}).join('');
 open(`<h3>装修商店</h3><p class="sub">现在小费加成 +${tipPct()}% · 🪙 ${S.coins}</p><div class="tabs"><button class="btn ${tab==='d'?'on':''}" data-tab="d">摆件</button><button class="btn ${tab==='t'?'on':''}" data-tab="t">地板主题</button></div>${body}<button class="btn" style="width:100%;background:#fff4c7" data-close>关闭</button>`);
}
$('bShop').onclick=()=>shop('d');
function names(){
 open(`<h3>给店取个名字</h3><p class="sub">挑一个，或者自己写（最多 8 个字）。</p><div class="names">${NAMES.map(n=>`<button data-nm="${n}" class="${n===S.shop?'on':''}">${n}</button>`).join('')}</div><div class="cname"><input id="nmIn" maxlength="8" placeholder="自己取名…" value=""><button class="btn p" data-nmc style="padding:0 16px">用这个</button></div><button class="btn" style="width:100%;background:#fff4c7" data-close>关闭</button>`);
}
$('shopName').onclick=names;
$('sheet').addEventListener('click',e=>{
 const n=e.target.closest('[data-nm]');if(n){S.shop=n.dataset.nm;save();renderHud();names();toast(`店名改成「${S.shop}」`);return}
 if(e.target.closest('[data-nmc]')){const v=$('nmIn').value.trim().slice(0,8);if(!v){toast('先写个名字');return}S.shop=v;save();renderHud();close();toast(`店名改成「${v}」`)}
});
$('bRecipes').onclick=book;
$('bStats').onclick=()=>open(`<h3>店铺档案</h3><p class="sub">${S.shop} · 店长兼甜点师：骆捷赢</p><button class="btn p" style="width:100%;margin-bottom:10px" id="toNames">✏️ 改店名（${NAMES.length} 个可选）</button>`+[['已服务客人',S.served],['累计收入','🪙 '+S.earned],['烤出点心',S.baked+' 份'],['等太久走掉的客人',S.missed],['店铺评分','★ '+S.rating.toFixed(1)]].map(([a,b])=>`<div class="row"><div class="info"><b>${a}</b></div><b>${b}</b></div>`).join('')+`<button class="btn" style="width:100%;margin-bottom:8px;background:#fff4c7" id="reset">重新开店（清空存档）</button><button class="btn p" style="width:100%" data-close>继续营业</button><p class="sub" style="text-align:center;margin-top:12px">同一位作者的另一款游戏：<a href="../" style="color:#ff5c9a;font-weight:900">钢魂烈斗 STEEL SOUL</a></p>`);
document.addEventListener('click',e=>{if(e.target.id==='toNames'){names();return}if(e.target.id!=='reset')return;
 if(e.target.dataset.sure){S=Object.assign({},def,{ovens:[null,null],stock:{},decor:[]});custs.forEach(c=>{c.el.remove();c.bu.remove()});custs=[];tasks=[];cur=null;setCarry(null);TB.forEach(t=>Object.assign(t,{occ:null,dirty:false,food:null,clearing:false}));save();close();all();toast('新店开张！')}
 else{e.target.dataset.sure=1;e.target.textContent='再点一次确认清空'}});

/* ---------- loops ---------- */
let last=performance.now();
function frame(t){
 const dt=Math.min(.05,(t-last)/1000);last=t;const now=Date.now();
 if(!cur&&tasks.length){cur=tasks.shift();cur.start&&cur.start();chef.path=buildPts(cur.to);curWait=cur.wait||300;renderChefSt()}
 const mv=move(chef,dt,440);
 if(cur&&!mv){curWait-=dt*1000;if(curWait<=0){const d=cur.done;cur=null;d&&d();renderChefSt()}}
 const layer=chef.y<430?$('chefK'):$('chefF');if(chefEl.parentNode!==layer)layer.appendChild(chefEl);
 chefEl.setAttribute('transform',`translate(${chef.x.toFixed(1)} ${(chef.y-(mv?Math.abs(Math.sin(t/90))*4:0)).toFixed(1)})`);
 chefEl.firstChild.setAttribute('transform',`scale(${chef.face*.78} .78)`);
 for(const c of custs.slice()){
  const m=move(c,dt,230);
  const tr=`translate(${c.x.toFixed(1)} ${(c.y-(m?Math.abs(Math.sin(t/110))*3:0)).toFixed(1)})`;c.el.setAttribute('transform',tr);c.bu.setAttribute('transform',tr);
  if(!m&&c.state==='in'){c.state='wait';c.t0=now;drawCust(c)}
  else if(!m&&c.state==='leave'){c.el.remove();c.bu.remove();custs=custs.filter(x=>x!==c);continue}
  if(c.state==='wait'){const f=1-(now-c.t0)/c.pat;if(c.pb)c.pb.setAttribute('width',Math.max(0,f*50).toFixed(1));
   const ml=f>.5?2:f>.2?1:0;if(ml!==c.ml){c.ml=ml;drawCust(c)}if(f<=0)leave(c,true)}
  if(c.state==='eat'&&now>c.eatEnd){const tb=TB[c.seat];pay(c,1.3);tb.food=null;tb.dirty=true;renderTables();leave(c)}
 }
 requestAnimationFrame(frame);
}
setInterval(()=>{
 const now=Date.now();
 if(now>nextSpawn){spawn();nextSpawn=now+(6000+Math.random()*5000)*(1.6-S.rating/5*.6)}
 renderOvens();renderHint();
},500);
all();
requestAnimationFrame(frame);
}
</script>
</body>
</html>
