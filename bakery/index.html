<style>
/* VOICE: sweet, lively bakery sim
   IDEA: a wide-angle cutaway of one whole dessert shop — kitchen, glass case, dining room, door
   PICTURE: the shop itself, with manager-pastry-chef 骆捷赢 walking between ovens and tables
   COLOUR and TYPE: strawberry pink + lemon yellow, hot pink accent; ZCOOL KuaiLe + Noto Sans SC
   LAYOUT: HUD, scene, hint, chef card, bottom bar; phone-first */
:root{color-scheme:light;--bg:#fff4c7;--ink:#5a2340;--soft:#9a5a78;--pink:#ff5c9a;--pink2:#ffb3cf;--yel:#ffd23f;--mint:#3fcf9a}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:light}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans SC",system-ui,sans-serif;overflow-x:clip;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hud{display:flex;gap:6px;align-items:center;padding:10px 12px;background:var(--pink);position:sticky;top:0;z-index:5}
.hud .t{background:none;border:0;padding:0;cursor:pointer;font-family:"ZCOOL KuaiLe",cursive;font-size:22px;color:#fff;flex:none;margin-right:auto;text-shadow:0 2px 0 #c2306c}
.chip{display:flex;align-items:center;gap:4px;background:#fff;border-radius:99px;padding:3px 10px;font-weight:900;font-size:14px;white-space:nowrap}
.lv{position:relative;width:86px}
.lv .bar{position:absolute;left:8px;right:8px;bottom:2px;height:4px;border-radius:3px;background:#ffd6e6;overflow:hidden}
.lv .bar i{display:block;height:100%;background:var(--yel);width:0}
#sc{display:block;width:100%;height:auto;font-family:"Noto Sans SC",sans-serif;background:#fffaf0}
#sc [data-act]{cursor:pointer}
#sc text{pointer-events:none}
.glow{animation:pulse .9s infinite}
@keyframes pulse{50%{opacity:.25}}
.fl{animation:fl 1.1s forwards;font-weight:900;paint-order:stroke;stroke:#c2306c;stroke-width:5px}
@keyframes fl{to{transform:translateY(-60px);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.panel{padding:12px;flex:1}
.strip{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#fff;border-bottom:3px solid var(--pink2);position:sticky;top:50px;z-index:4}
.strip b{font-family:"ZCOOL KuaiLe",cursive;font-weight:400;font-size:18px;color:var(--pink);white-space:nowrap}
.sbar{flex:1;height:10px;border-radius:6px;background:#ffe3ee;overflow:hidden}
.sbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yel),var(--pink));transition:width .4s}
.strip .sp{font-size:13px;font-weight:900;white-space:nowrap}
.lives{color:var(--pink);font-size:15px;letter-spacing:-1px;white-space:nowrap}
.ib{flex:none;width:40px;height:40px;border-radius:12px;border:0;background:var(--yel);display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 #e0a800}
.ib svg{width:20px;height:20px}
.ib:focus-visible{outline:3px solid var(--ink)}
.savebox textarea{width:100%;min-height:90px;border:2px solid var(--pink2);border-radius:14px;padding:10px;font:14px/1.4 ui-monospace,monospace;color:var(--ink);resize:vertical;user-select:text;-webkit-user-select:text}
.savebox .st{display:flex;align-items:center;gap:10px;background:#e8fff4;border-radius:14px;padding:12px;margin-bottom:12px;font-weight:700}
.savebox h4{margin:14px 0 6px;font-size:15px}
.set{display:grid;gap:12px;margin-bottom:14px}
.set label{display:grid;grid-template-columns:5.5em minmax(0,1fr) 3em;align-items:center;gap:10px;font-weight:700}
.set input[type=range]{width:100%;accent-color:var(--pink);height:32px}
.set .v{text-align:right;font-size:14px;color:var(--soft)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:30%;min-height:44px;border:2px solid #ffd6e6;border-radius:12px;background:#fff;font:700 14px "Noto Sans SC",sans-serif;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.tg{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.tg button{min-width:72px}
.big{font-size:52px;text-align:center;margin:4px 0}
.ups .row .info span b{display:inline;color:var(--pink)}
.hint{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--yel);border-radius:16px;padding:10px 12px;font-weight:700;font-size:15px;box-shadow:0 4px 0 #f0c020}
.hint .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--yel);display:grid;place-items:center;font-weight:900}
.chef{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:8px 12px;margin-top:10px;box-shadow:0 4px 0 var(--pink2)}

.chef small{color:var(--soft);margin-left:6px}
.chef p{margin:0;font-size:14px;font-weight:700}
.chef .q{flex:none;font-size:13px;color:var(--soft);text-align:right}
.note{font-size:13px;color:var(--soft);text-align:center;margin:12px 0 0}
.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--pink);position:sticky;bottom:0;z-index:5}
.nav button,.btn{min-height:44px;border:0;border-radius:14px;font:900 15px "Noto Sans SC",sans-serif;cursor:pointer;background:#fff;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn.p{background:var(--yel);box-shadow:0 3px 0 #e0a800}
.btn.s{background:#fff4c7;min-height:38px;font-size:13px;padding:0 10px}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.nav button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.modal{position:fixed;inset:0;background:#5a234066;display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.sheet{width:100%;max-width:560px;max-height:84vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:16px 14px 24px;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-family:"ZCOOL KuaiLe",cursive;font-weight:400;font-size:24px;margin:0 0 4px;color:var(--pink)}
.sheet p.sub{margin:0 0 12px;color:var(--soft);font-size:14px}
.row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:#fff4c7;margin-bottom:8px;border:2px solid transparent;flex-wrap:wrap}
.row.want{border-color:var(--pink);background:#ffe3ee}
.row>svg,.row>.ph{width:64px;height:64px;flex:none;border-radius:12px}
.ph{object-fit:cover;display:block}
.row .info{flex:1;min-width:120px}
.row .info b{display:block}
.row .info span{font-size:13px;color:var(--soft)}
.row .info em{font-style:normal;font-size:12px;font-weight:900;color:#fff;background:var(--pink);border-radius:99px;padding:1px 8px;margin-left:4px}
.row .acts{display:flex;gap:6px;flex:none}
.row .btn{padding:0 14px}
.row.lockd{opacity:.5}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.names button{min-height:48px;border:2px solid #ffd6e6;border-radius:14px;background:#fff;font:400 18px "ZCOOL KuaiLe",cursive;color:var(--ink);cursor:pointer}
.names button.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.cname{display:flex;gap:8px;margin-bottom:12px}
.cname input{flex:1;min-height:44px;border:2px solid var(--pink2);border-radius:14px;padding:0 12px;font:16px "Noto Sans SC",sans-serif;color:var(--ink)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;background:#fff4c7}
.tabs button.on{background:var(--pink);color:#fff}
.toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;padding:8px 16px;border-radius:99px;z-index:30;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;top:72px}
@media(max-width:380px){.hud .t{font-size:18px}.chip{padding:3px 7px;font-size:13px}.lv{width:74px}}
@media(prefers-reduced-motion:reduce){.glow,.fl,.shake,.sheet{animation:none!important}}
</style>

try{S=Object.assign({},def,JSON.parse(localStorage.getItem('moonBakery')||'{}'))}catch(e){S=Object.assign({},def)}

S.stage=S.stage||1;S.sServed=S.sServed||0;S.sMiss=S.sMiss||0;S.upOven=S.upOven||0;S.upWarm=S.upWarm||0;S.upPat=S.upPat||0;

const AU={ctx:null,mg:null,sg:null,tm:null,ev:[],pos:0,t0:0,loopLen:0,bpm:80};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function audioInit(){
 if(AU.ctx){if(AU.ctx.state==='suspended'&&!paused)AU.ctx.resume();return}
 const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
 const ctx=new C();AU.ctx=ctx;
 const master=ctx.createGain();master.connect(ctx.destination);
 const rv=ctx.createConvolver(),len=Math.floor(ctx.sampleRate*2.4),buf=ctx.createBuffer(2,len,ctx.sampleRate);
 for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)}
 rv.buffer=buf;const rg=ctx.createGain();rg.gain.value=.32;rv.connect(rg);rg.connect(master);
 const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;lp.connect(master);lp.connect(rv);
 AU.mg=ctx.createGain();AU.mg.connect(lp);
 AU.sg=ctx.createGain();AU.sg.connect(master);const sr=ctx.createGain();sr.gain.value=.5;AU.sg.connect(sr);sr.connect(rv);
 applyVol();startMusic(true);if(paused)ctx.suspend();
}
function applyVol(){if(!AU.ctx)return;AU.mg.gain.setTargetAtTime(SET.music*.32,AU.ctx.currentTime,.1);AU.sg.gain.setTargetAtTime(SET.sfx*.55,AU.ctx.currentTime,.05)}
function tone(dest,t,m,dur,vol,inst){
 const ctx=AU.ctx,g=ctx.createGain(),f=mtof(m);g.connect(dest);
 const os=[];const add=(type,mul,v,det=0)=>{const o=ctx.createOscillator();o.type=type;o.frequency.value=f*mul;o.detune.value=det;const gg=ctx.createGain();gg.gain.value=v;o.connect(gg);gg.connect(g);os.push(o)};
 let a=.012,rel=dur;
 if(inst==='ep'){add('sine',1,1);add('sine',2,.18,4);add('triangle',1,.12,-3);rel=dur*1.2}
 else if(inst==='box'){add('sine',1,1);add('sine',4,.12);add('sine',3,.06);a=.004;rel=Math.max(1.4,dur)}
 else if(inst==='bass'){add('sine',1,1);add('triangle',1,.25);a=.02}
 else if(inst==='pad'){add('triangle',1,.6,-6);add('triangle',1,.6,6);a=Math.min(.6,dur/3)}
 else{add('sine',1,1);add('triangle',2,.15)}
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+a);
 if(inst==='pad'){g.gain.setValueAtTime(vol,t+dur*.7);g.gain.linearRampToValueAtTime(0,t+dur)}
 else g.gain.exponentialRampToValueAtTime(.0008,t+rel);
 const end=t+(inst==='pad'?dur:rel)+.05;os.forEach(o=>{o.start(t);o.stop(end)});
}
const TRACKS=[
 {bpm:78,B:4,lead:'ep',chords:[[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]],bass:[41,40,38,36],comp:[[0,1.4,.5],[1.5,.9,.32],[3,.9,.3]],seed:7},
 {bpm:100,B:3,lead:'box',chords:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],bass:[36,33,29,31],comp:[[1,.8,.3],[2,.8,.26]],seed:21},
 {bpm:62,B:4,lead:'ep',chords:[[50,53,57,60,64],[55,59,62,65],[48,52,55,59,62],[57,61,64,67]],bass:[38,43,36,45],comp:[[0,3.8,.28,'pad'],[2.5,.8,.25]],seed:42}
];
function buildLoop(T){
 let sd=T.seed;const rng=()=>(sd=(sd*9301+49297)%233280)/233280;
 const scale=[0,2,4,5,7,9,11];const inScale=m=>scale.includes(((m%12)+12)%12);
 const rh4=[[0,2],[0,1,2,3],[0,1.5,3],[0,1,1.5,2,3],[0,.5,1,2],[0,2,3]],rh3=[[0,1,2],[0,2],[0,1.5,2],[0]];
 const phrase=()=>{let prev=74;const bars=[];for(let b=0;b<4;b++){const ch=T.chords[b];const rs=T.B===4?rh4:rh3;const rhy=b===3?[0]:rs[Math.floor(rng()*rs.length)];
  const notes=rhy.map((o,k)=>{const strong=o%1===0;let cand=[];for(let m=64;m<=86;m++){if(!inScale(m))continue;const ct=ch.some(c=>((c-m)%12+12)%12===0);if(strong&&!ct)continue;cand.push(m)}

$('sheet').addEventListener('click',e=>{
 const n=e.target.closest('[data-nm]');if(n){S.shop=n.dataset.nm;save();renderHud();names();toast(`店名改成「${S.shop}」`);return}
 if(e.target.closest('[data-nmc]')){const v=$('nmIn').value.trim().slice(0,8);if(!v){toast('先写个名字');return}S.shop=v;save();renderHud();close();toast(`店名改成「${v}」`)}
});
$('bRecipes').onclick=book;
$('bStats').onclick=()=>open(`<h3>店铺档案</h3><p class="sub">${S.shop} · 店长兼甜点师：骆捷赢</p><button class="btn p" style="width:100%;margin-bottom:10px" id="toNames">✏️ 改店名（${NAMES.length} 个可选）</button>`+[['已服务客人',S.served],['累计收入','🪙 '+S.earned],['烤出点心',S.baked+' 份'],['等太久走掉的客人',S.missed],['店铺评分','★ '+S.rating.toFixed(1)]].map(([a,b])=>`<div class="row"><div class="info"><b>${a}</b></div><b>${b}</b></div>`).join('')+`<button class="btn" style="width:100%;margin-bottom:8px;background:#fff4c7" id="reset">重新开店（清空存档）</button><button class="btn p" style="width:100%" data-close>继续营业</button><p class="sub" style="text-align:center;margin-top:12px">同一位作者的另一款游戏：<a href="../" style="color:#ff5c9a;font-weight:900">钢魂烈斗 STEEL SOUL</a></p>`);
document.addEventListener('click',e=>{if(e.target.id==='toNames'){names();return}if(e.target.id!=='reset')return;
 if(e.target.dataset.sure){S=Object.assign({},def,{ovens:[null,null],stock:{},decor:[]});custs.forEach(c=>{c.el.remove();c.bu.remove()});custs=[];tasks=[];cur=null;setCarry(null);TB.forEach(t=>Object.assign(t,{occ:null,dirty:false,food:null,clearing:false}));save();close();all();toast('新店开张！')}
 else{e.target.dataset.sure=1;e.target.textContent='再点一次确认清空'}});

/* ---------- loops ---------- */
let last=performance.now();const lastOv=[];
function frame(t){
 const dt=Math.min(.05,(t-last)/1000);last=t;if(paused){requestAnimationFrame(frame);return}const now=gnow();
 if(!cur&&tasks.length){cur=tasks.shift();cur.start&&cur.start();chef.path=buildPts(cur.to);curWait=cur.wait||300;renderChefSt()}
 const mv=move(chef,dt,440);
 if(cur&&!mv){curWait-=dt*1000;if(curWait<=0){const d=cur.done;cur=null;d&&d();renderChefSt()}}
 const layer=chef.y<430?$('chefK'):$('chefF');if(chefEl.parentNode!==layer)layer.appendChild(chefEl);
 chefEl.setAttribute('transform',`translate(${chef.x.toFixed(1)} ${(chef.y-(mv?Math.abs(Math.sin(t/90))*4:0)).toFixed(1)})`);
 chefEl.firstChild.setAttribute('transform',`scale(${chef.face*.78} .78)`);
 for(const c of custs.slice()){
  const m=move(c,dt,230);
  const tr=`translate(${c.x.toFixed(1)} ${(c.y-(m?Math.abs(Math.sin(t/110))*3:0)).toFixed(1)})`;c.el.setAttribute('transform',tr);c.bu.setAttribute('transform',tr);
  if(!m&&c.state==='in'){c.state='wait';c.t0=now;drawCust(c)}
  else if(!m&&c.state==='leave'){c.el.remove();c.bu.remove();custs=custs.filter(x=>x!==c);continue}
  if(c.state==='wait'){const f=1-(now-c.t0)/c.pat;if(c.pb)c.pb.setAttribute('width',Math.max(0,f*50).toFixed(1));
   const ml=f>.5?2:f>.2?1:0;if(ml!==c.ml){c.ml=ml;drawCust(c)}if(f<=0)leave(c,true)}
  if(c.state==='eat'&&now>c.eatEnd){const tb=TB[c.seat];pay(c,1.3);tb.food=null;tb.dirty=true;renderTables();leave(c)}
 }
 requestAnimationFrame(frame);
}
setInterval(()=>{
 if(paused)return;
 const now=gnow();
 S.ovens.forEach((o,i)=>{const st=o?ovState(o,now)[0]:'e';if(st==='f'&&lastOv[i]==='b')sfx('done');lastOv[i]=st});
 if(now>nextSpawn){spawn();nextSpawn=now+(6000+Math.random()*5000)*(1.6-S.rating/5*.6)*spawnMult()}
 renderOvens();renderHint();
},500);
all();
requestAnimationFrame(frame);
}
</script>
</body>
</html>
